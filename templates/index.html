<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna AI Assistant</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, Arial, sans-serif; max-width: 850px; margin: 32px auto; padding: 0 16px; background: #f4f7fb; color: #172033; }
    .panel { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px #14213d12; }
    h1 { margin-top: 0; color: #165dba; }
    #chat { min-height: 280px; max-height: 55vh; overflow-y: auto; padding: 12px 0; }
    .message { padding: 12px 14px; border-radius: 12px; margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .assistant { background: #e8f5ec; }
    .user { background: #e6efff; margin-left: 8%; }
    .error { background: #ffeded; color: #8d1d1d; }
    textarea { box-sizing: border-box; width: 100%; min-height: 85px; resize: vertical; padding: 12px; border: 1px solid #c8d1df; border-radius: 10px; font: inherit; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; margin: 8px 8px 0 0; background: #165dba; color: white; font: inherit; cursor: pointer; }
    button.secondary { background: #e8edf5; color: #172033; }
    button:disabled { opacity: .6; cursor: wait; }
    .hint { color: #536176; font-size: .92rem; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Luna AI Assistant</h1>
    <p class="hint">Connected to your Microsoft Foundry agent.</p>
    <div id="chat" aria-live="polite">
      <div class="message assistant">Hello! I am Luna. How can I help you?</div>
    </div>
    <form id="chat-form">
      <label for="message">Your message</label>
      <textarea id="message" maxlength="10000" required placeholder="Ask Luna a question..."></textarea>
      <div>
        <button id="send" type="submit">Send message</button>
        <button class="secondary" id="reset" type="button">New conversation</button>
      </div>
    </form>
  </main>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(role, content) {
      const el = document.createElement("div");
      el.className = "message " + role;
      el.textContent = content;
      chat.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage("user", message);
      input.value = "";
      send.disabled = true;
      send.textContent = "Thinking...";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        addMessage("assistant", data.reply || "(No text returned)");
      } catch (err) {
        addMessage("error", "Error: " + err.message);
      } finally {
        send.disabled = false;
        send.textContent = "Send message";
        input.focus();
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      try {
        const response = await fetch("/new-conversation", { method: "POST" });
        if (!response.ok) throw new Error("Could not reset conversation");
        chat.replaceChildren();
        addMessage("assistant", "New conversation started.");
      } catch (err) {
        addMessage("error", err.message);
      }
    });
  </script>
</body>
</html>
